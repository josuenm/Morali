services:
  sqlserver:
    image: mcr.microsoft.com/azure-sql-edge:latest
    container_name: morali-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Morali@123"
    ports:
      - "1433:1433"
    volumes:
      - mssql_global_data:/var/opt/mssql

volumes:
  mssql_global_data: